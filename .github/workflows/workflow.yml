name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Install Android platform-tools
        run: |
          mkdir -p $HOME/android-sdk
          cd $HOME/android-sdk
          curl -L -o platform-tools.zip https://dl.google.com/android/repository/platform-tools-latest-linux.zip
          unzip -o -q platform-tools.zip
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH
          which adb

      - name: Export APK
        run: |
          mkdir -p build
          godot --headless --export-release "Android" build/hero.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hero-apk
          path: build/*.apk
