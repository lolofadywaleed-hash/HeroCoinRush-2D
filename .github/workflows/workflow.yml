name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Export APK
        run: |
          mkdir -p build
          godot --headless --export-release "Android" build/hero.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hero-apk
          path: build/*.apk
